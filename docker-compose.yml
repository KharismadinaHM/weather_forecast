services:
  db:
    image: postgres:16-alpine
    container_name: hk_weather_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hk_weather}
      POSTGRES_USER: ${POSTGRES_USER:-hkw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hkw_secret_pass}
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hkw} -d ${POSTGRES_DB:-hk_weather}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hk_weather_migrate
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hkw}:${POSTGRES_PASSWORD:-hkw_secret_pass}@db:5432/${POSTGRES_DB:-hk_weather}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hk_weather}
      POSTGRES_USER: ${POSTGRES_USER:-hkw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hkw_secret_pass}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
    name: hk_weather_pgdata
