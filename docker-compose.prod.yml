services:
  postgres:
    image: postgres:16-alpine
    container_name: hk_weather_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hk_weather}
      POSTGRES_USER: ${POSTGRES_USER:-hkw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hkw_prod_secret_pass}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hkw} -d ${POSTGRES_DB:-hk_weather}"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hk_weather_agent_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hk_weather}
      POSTGRES_USER: ${POSTGRES_USER:-hkw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hkw_prod_secret_pass}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hkw}:${POSTGRES_PASSWORD:-hkw_prod_secret_pass}@postgres:5432/${POSTGRES_DB:-hk_weather}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hk_weather_dashboard_prod
    restart: unless-stopped
    command: streamlit run app/dashboard/main.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hk_weather}
      POSTGRES_USER: ${POSTGRES_USER:-hkw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hkw_prod_secret_pass}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hkw}:${POSTGRES_PASSWORD:-hkw_prod_secret_pass}@postgres:5432/${POSTGRES_DB:-hk_weather}
    ports:
      - "8501:8501"

volumes:
  postgres_prod_data:
